<!doctype html>
<html lang="en" style="background:#2a2a2e">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2a2a2e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&display=swap" />
    <title>Web-Based Engineering Drawing Tool</title>
    <style>
      :root{--bg:#2a2a2e}
      html{background:#2a2a2e!important}
      body{background:#2a2a2e!important;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
      #root{background-color:#2a2a2e!important;min-height:100vh}

      #boot-shell {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #0f0f12;
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 10px;
        pointer-events: none;
        opacity: 1;
        transition: opacity 180ms ease;
      }

      #boot-shell.boot-shell-hidden {
        opacity: 0;
      }

      .boot-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #cc8bed;
        box-shadow: 0 0 0 0 rgba(204, 139, 237, 0.5);
        animation: boot-pulse 0.9s ease-in-out infinite;
      }

      .boot-label {
        margin: 0;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.68);
        letter-spacing: 0.05em;
      }

      @keyframes boot-pulse {
        0% { transform: scale(0.8); opacity: 0.6; }
        50% { transform: scale(1); opacity: 1; }
        100% { transform: scale(0.8); opacity: 0.6; }
      }
    </style>
  </head>
  <body style="background:#2a2a2e">
    <div id="root" style="background:#2a2a2e"></div>
    <div id="boot-shell" aria-live="polite" aria-busy="true">
      <div class="boot-dot" aria-hidden="true"></div>
      <p class="boot-label">Starting</p>
    </div>
    <script>
      window.setTimeout(function () {
        var shell = document.getElementById('boot-shell');
        if (!shell) return;
        shell.classList.add('boot-shell-hidden');
        window.setTimeout(function () { shell.remove(); }, 220);
      }, 1500);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
