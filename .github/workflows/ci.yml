name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Bundle size guard (EditorPage chunk < 200 kB)
        run: |
          SIZE=$(find dist/assets -name 'EditorPage-*.js' -exec wc -c {} \; | awk '{print $1}')
          echo "EditorPage chunk: ${SIZE} bytes"
          [ "$SIZE" -lt 204800 ] || (echo "FAIL: EditorPage chunk exceeded 200 kB" && exit 1)
